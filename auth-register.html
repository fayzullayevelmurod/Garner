<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garner</title>
    <!-- Swiper css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- Swiper css -->
    <!-- favicon -->
    <link rel="icon" href="./images/logo/favicon.svg">
    <!-- favicon -->
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!-- fonts -->
    <!-- css link -->
    <link rel="stylesheet" href="./assets/scss/style.css">
    <!-- css link -->
</head>
<body>
    <div class="wrapper">
        <main class="auth-page auth-page--register">
            <section class="auth-page__card" aria-labelledby="register-title">
                <div class="auth-page__header">
                    <h1 class="auth-page__title" id="register-title">Регистрация</h1>
                    <div class="auth-page__account">
                        <span class="auth-page__account-label">Уже есть аккаунт?</span>
                        <a href="auth-login.html">Войти</a>
                        <button class="auth-page__close" type="button" aria-label="Закрыть">×</button>
                    </div>
                </div>
                <form class="auth-page__form" action="#" method="post">
                    <label class="auth-page__field">
                        <span class="auth-page__label">Имя <span>*</span></span>
                        <input class="auth-page__input" type="text" name="first_name" placeholder="Иван" autocomplete="given-name" required>
                    </label>
                    <label class="auth-page__field">
                        <span class="auth-page__label">Фамилия <span>*</span></span>
                        <input class="auth-page__input" type="text" name="last_name" placeholder="Иванов" autocomplete="family-name" required>
                    </label>
                    <label class="auth-page__field">
                        <span class="auth-page__label">Почта <span>*</span></span>
                        <input class="auth-page__input" type="email" name="email" placeholder="Иван" autocomplete="email" required>
                    </label>
                    <div class="auth-page__field">
                        <span class="auth-page__label">Ваш номер <span>*</span></span>
                        <div class="phone-input auth-page__phone">
                            <div class="phone-input__country">
                                <button type="button" class="phone-input__country-trigger" aria-expanded="false">
                                    <span class="phone-input__flag"></span>
                                    <svg class="phone-input__country-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M6.00194 7.29347L2.35544 3.64697L1.64844 4.35397L6.00194 8.70747L10.3554 4.35397L9.64844 3.64697L6.00194 7.29347Z" fill="#161516" />
                                    </svg>
                                    <span class="phone-input__code"></span>
                                </button>
                                <div class="phone-input__country-dropdown"></div>
                            </div>
                            <input id="user_tel_field" name="user_tel_field" type="text" class="phone-input__input" placeholder="+7 (000) 000-00-00" autocomplete="tel">
                        </div>
                    </div>
                    <label class="auth-page__field">
                        <span class="auth-page__label">Страна <span>*</span></span>
                        <select class="auth-page__input" name="country" required>
                            <option value="">Россия</option>
                        </select>
                    </label>
                    <label class="auth-page__field">
                        <span class="auth-page__label">Регион/область <span>*</span></span>
                        <select class="auth-page__input" name="region" required>
                            <option value="">-- &nbsp; Выберите &nbsp; --</option>
                        </select>
                    </label>
                    <label class="auth-page__field">
                        <span class="auth-page__label">Почтовый индекс <span>*</span></span>
                        <input class="auth-page__input" type="text" name="postal_code" placeholder="Почтовый индекс" autocomplete="postal-code" required>
                    </label>
                    <label class="auth-page__field">
                        <span class="auth-page__label">Город <span>*</span></span>
                        <input class="auth-page__input" type="text" name="city" placeholder="Город" autocomplete="address-level2" required>
                    </label>
                    <label class="auth-page__field auth-page__field--full">
                        <span class="auth-page__label">Пароль <span>*</span></span>
                        <input class="auth-page__input" type="password" name="password" placeholder="Пароль" autocomplete="new-password" required>
                    </label>
                    <label class="auth-page__field auth-page__field--full">
                        <span class="auth-page__label">Подтвердите пароль <span>*</span></span>
                        <input class="auth-page__input" type="password" name="password_confirmation" placeholder="Подтвердите пароль" autocomplete="new-password" required>
                    </label>
                    <div class="auth-page__checks">
                        <label class="custom-checkbox">
                            <input type="checkbox" name="personal_data" required>
                            <span class="custom-checkbox__box">
                                <svg width="9" height="7" viewBox="0 0 9 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M8.5 0.5L3 6L0.5 3.5" stroke="#B16A37" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </span>
                            <span class="custom-checkbox__text">Даю согласие на обработку персональных данных</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="privacy_policy" required>
                            <span class="custom-checkbox__box">
                                <svg width="9" height="7" viewBox="0 0 9 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M8.5 0.5L3 6L0.5 3.5" stroke="#B16A37" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </span>
                            <span class="custom-checkbox__text">Я согласен с политикой конфиденциальности</span>
                        </label>
                        <label class="custom-checkbox">
                            <input type="checkbox" name="marketing">
                            <span class="custom-checkbox__box">
                                <svg width="9" height="7" viewBox="0 0 9 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M8.5 0.5L3 6L0.5 3.5" stroke="#B16A37" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </span>
                            <span class="custom-checkbox__text">Я даю согласие на рекламную рассылку</span>
                        </label>
                    </div>
                    <button class="auth-page__button auth-page__button--register btn-radial" type="submit">Зарегистрироваться</button>
                </form>
            </section>
        </main>
    </div>

    <!-- iMask -->
    <script src="./assets/scripts/iMask.js"></script>
    <!-- iMask -->
    <!-- Swiper js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <!-- Swiper js -->
    <!-- js file -->
    <script src="./assets/scripts/main.js" defer></script>
    <!-- js file -->
</body>
</html>
