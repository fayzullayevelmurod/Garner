<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garner</title>
    <!-- Swiper css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- Swiper css -->
    <!-- favicon -->
    <link rel="icon" href="./images/logo/favicon.svg">
    <!-- favicon -->
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!-- fonts -->
    <!-- css link -->
    <link rel="stylesheet" href="./assets/scss/style.css">
    <!-- css link -->
</head>
<body>
    <div class="wrapper">
        <main class="auth-page auth-page--login">
            <section class="auth-page__card" aria-labelledby="login-title">
                <div class="auth-page__header">
                    <h1 class="auth-page__title" id="login-title">Авторизация</h1>
                    <button class="auth-page__close" type="button" aria-label="Закрыть">×</button>
                </div>
                <form class="auth-page__form" action="#" method="post">
                    <label class="auth-page__field">
                        <span class="auth-page__label">Почта <span>*</span></span>
                        <input class="auth-page__input" type="email" name="email" placeholder="ivanov@yandex.ru" required>
                    </label>
                    <label class="auth-page__field">
                        <span class="auth-page__label">Пароль <span>*</span></span>
                        <input class="auth-page__input" type="password" name="password" placeholder="Пароль" required>
                    </label>
                    <a class="auth-page__forgot" href="#">Забыли пароль?</a>
                    <div class="auth-page__actions">
                        <button class="auth-page__button btn-radial" type="submit">Войти</button>
                        <a class="auth-page__button btn-white" href="auth-register.html">Регистрация</a>
                    </div>
                </form>
            </section>
        </main>
    </div>
    
    <!-- iMask -->
    <script src="./assets/scripts/iMask.js"></script>
    <!-- iMask -->
    <!-- Swiper js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
    <!-- Swiper js -->
    <!-- js file -->
    <script src="./assets/scripts/main.js" defer></script>
    <!-- js file -->
</body>
</html>
